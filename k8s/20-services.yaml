---
apiVersion: batch/v1
kind: CronJob
metadata: {name: pulsewatch-analytics, namespace: pulsewatch}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: analytics
              image: ghcr.io/your-user/pulsewatch-python:latest
              command: ["python", "analyze.py", "--once"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: pulsewatch-db, key: DATABASE_URL}
              resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
