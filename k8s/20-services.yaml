apiVersion: apps/v1
kind: Deployment
metadata: {name: pulsewatch-api, namespace: pulsewatch}
spec:
  replicas: 1
  selector: {matchLabels: {app: pulsewatch-api}}
  template:
    metadata: {labels: {app: pulsewatch-api}}
    spec:
      containers:
        - name: api
          image: ghcr.io/your-user/pulsewatch-go:latest
          command: ["/bin/api"]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: pulsewatch-db, key: DATABASE_URL}
            - name: API_KEY
              valueFrom:
                secretKeyRef: {name: pulsewatch-api, key: API_KEY}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: pulsewatch-api, namespace: pulsewatch}
spec:
  selector: {app: pulsewatch-api}
  ports: [{port: 80, targetPort: 8080}]
---
