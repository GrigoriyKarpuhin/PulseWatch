apiVersion: batch/v1
kind: Job
metadata:
  name: pulsewatch-migrate
  namespace: pulsewatch
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/your-user/pulsewatch-go:latest
          command: ["/bin/migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: pulsewatch-db, key: DATABASE_URL}
